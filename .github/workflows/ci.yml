name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      matrix:
        node: ['24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install pinned development compiler without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript core check
        run: npm run check:types
      - name: Runtime, exhaustive coverage, CLI, and race tests
        run: node --test tests/*.test.mjs
      - name: Release inventory and credential patterns
        run: node scripts/check-release.mjs
      - name: Exact-coverage CI demo
        run: node cli.mjs examples/complete.json --check
      - name: Exact large-offset demo
        run: node cli.mjs examples/large-offsets.json --format json
